controller_manager: #name of the node to controll
  ros__parameters:
    #configuration parameters
    update_rate: 10 #Hz

    arm_controller:
      #type of controller
      type: joint_trajectory_controller/JointTrajectoryController

    # gripper_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      #publish current state from joint in a topic
      type: joint_state_broadcaster/JointStateBroadcaster


arm_controller:
  ros__parameters:
    joints: 
      - joint_1 
      - joint_2 
      - joint_3
      - joint_4
      - joint_5
      # - joint_6
    
    command_interfaces: 
      - position

    state_interfaces: 
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

